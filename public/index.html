<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create your wedding invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Sacramento&family=Great+Vibes&family=Cinzel+Decorative&display=swap" rel="stylesheet">
<style>
body{font:16px/1.5 system-ui,sans-serif;max-width:640px;margin:auto;padding:1rem;color:#222}
fieldset{border:1px solid #ccc;border-radius:10px;margin:1rem 0;padding:1rem}legend{font-weight:600;padding:0 .4rem}
label{display:block;margin:.6rem 0 .1rem;font-size:.9rem}input,textarea{width:100%;padding:.5rem;border:1px solid #bbb;border-radius:6px;font:inherit}
.themes{display:flex;gap:.6rem}.themes label{flex:1;border:2px solid #ccc;border-radius:8px;padding:.6rem;text-align:center;cursor:pointer;margin:0}
.themes input{width:auto}button{background:#222;color:#fff;border:0;border-radius:8px;padding:.8rem 1.6rem;font:inherit;cursor:pointer}
#out{background:#eef7ee;border-radius:10px;padding:1rem;margin-top:1rem}#err{color:#b00}.hp{position:absolute;left:-999px}
.themes{display:grid;grid-template-columns:repeat(2,1fr)}.themes label{position:relative;padding:.4rem}.themes input{position:absolute;opacity:0}
.themes label:has(input:checked){border-color:#222;box-shadow:0 0 0 2px #222}.themes label:has(input:focus-visible){outline:2px solid #06f}
.pv{position:relative;height:130px;border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:.3rem}
.pv span{font-size:1.7rem;line-height:1.1}.pv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
</style></head><body>
<h1>Create your wedding invitation</h1>
<form id="f">
<fieldset><legend>Design</legend><div class="themes" id="themes"></div></fieldset>
<fieldset><legend>Couple</legend>
<label>Groom's full name<input name="gname" required></label><label>Groom's parents<input name="gparents"></label>
<label>Bride's full name<input name="bname" required></label><label>Bride's parents<input name="bparents"></label>
<label>Couple photo<input type="file" accept="image/*" data-p="couplePhoto"></label>
<label>Groom photo<input type="file" accept="image/*" data-p="groomPhoto"></label>
<label>Bride photo<input type="file" accept="image/*" data-p="bridePhoto"></label></fieldset>
<div id="evs"></div>
<fieldset><legend>Message and extras</legend>
<label>Invitation message<textarea name="message" rows="5">We joyfully invite you to celebrate our wedding. Your presence and blessings will make our day complete.</textarea></label>
<label>Countdown to (wedding date and time)<input type="datetime-local" name="countdown"></label>
<label>WhatsApp number for wishes (with country code)<input name="whatsapp" placeholder="919876543210"></label>
<label>Gallery photos (up to 6)<input type="file" accept="image/*" multiple id="gal"></label></fieldset>
<fieldset><legend>Background and song</legend>
<label>Custom background (tall image, optional). It pans slowly as guests scroll.<input type="file" accept="image/*" data-p="bgImage"></label>
<label>Song<select name="songpick" id="sp"><option value="">No song</option><option value="upload">Upload my own (MP3, under 2.5 MB)</option></select></label>
<label id="sf" hidden>Song file<input type="file" accept="audio/*" id="sg"></label></fieldset>
<fieldset><legend>Your link</legend><label>Link name (letters, numbers, dashes)<input name="slug" required pattern="[a-zA-Z0-9\-]+" placeholder="kiran-mounika"></label></fieldset>
<input class="hp" name="website" tabindex="-1" autocomplete="off">
<button id="go">Create invitation</button><p id="err"></p></form><div id="out" hidden></div>
<script>
const f=document.getElementById('f'),P={gallery:[]},q=new URLSearchParams(location.search);let token=q.get('token');
const THEMES=[['gold','Midnight gold','#0b0b0b','#c9922a','Sacramento'],['floral','Blush floral','#fff7f5','#c4577a','Great Vibes'],['royal','Royal red','#4d0c17','#e0b04a','Cinzel Decorative'],['temple','Temple scroll','linear-gradient(#f6a84b,#7a2e0e 60%,#2a0c04)','#fff1d6','Great Vibes']];
document.getElementById('themes').innerHTML=THEMES.map(([id,n,bg,ac,ff],i)=>`<label><input type="radio" name="theme" value="${id}"${i?'':' checked'}><div class="pv" style="background:${bg};color:${ac};font-family:'${ff}',cursive"><span>Kiran &amp; Mounika</span><img src="/previews/${id}.webp" alt="" onerror="this.remove()"></div>${n}</label>`).join('');
const titles=['Reception','Wedding','Another event (optional)'];
document.getElementById('evs').innerHTML=[0,1,2].map(i=>`<fieldset><legend>Event ${i+1}</legend>
<label>Event name<input name="e${i}title" value="${i<2?titles[i]:''}"></label><label>Venue name<input name="e${i}venue"></label>
<label>Address<input name="e${i}addr"></label><label>Date<input type="date" name="e${i}date"></label>
<label>Time (e.g. 6:00 PM)<input name="e${i}time"></label><label>Google Maps link<input type="url" name="e${i}map"></label></fieldset>`).join('');
async function shrink(file,W=900,H=900){const b=await createImageBitmap(file),r=Math.min(1,W/b.width,H/b.height),c=document.createElement('canvas');
 c.width=b.width*r;c.height=b.height*r;c.getContext('2d').drawImage(b,0,0,c.width,c.height);const w=c.toDataURL('image/webp',.72);return w.startsWith('data:image/webp')?w:c.toDataURL('image/jpeg',.72)}
f.querySelectorAll('[data-p]').forEach(i=>i.onchange=async()=>{P[i.dataset.p]=i.files[0]?await shrink(i.files[0],...(i.dataset.p=='bgImage'?[800,4000]:[900,900])):''});
document.getElementById('gal').onchange=async e=>{P.gallery=await Promise.all([...e.target.files].slice(0,6).map(x=>shrink(x)))};
const sp=document.getElementById('sp'),sf=document.getElementById('sf');
const L=fetch('/music/list.json').then(r=>r.ok?r.json():[]).then(l=>l.forEach(([x,n])=>sp.add(new Option(n,'/music/'+x)))).catch(()=>{});
sp.onchange=()=>sf.hidden=sp.value!='upload';
document.getElementById('sg').onchange=e=>{const x=e.target.files[0],er=document.getElementById('err');if(!x)return;
 if(x.size>2.5e6){e.target.value='';P.song='';er.textContent='That song is over 2.5 MB. Trim or compress it, then choose it again.';return}
 er.textContent='';const rd=new FileReader();rd.onload=()=>P.song=rd.result;rd.readAsDataURL(x)};
if(q.get('edit'))fetch('/api/get?slug='+q.get('edit')).then(r=>r.json()).then(d=>{
 for(const[k,v]of Object.entries(d)){if(['couplePhoto','groomPhoto','bridePhoto','gallery','bgImage','song'].includes(k))P[k]=v;else if(f.elements[k]&&k!='token')f.elements[k].value=v}
 L.then(()=>{if(d.song){if(d.song.startsWith('data:')){sp.value='upload';sf.hidden=false}else sp.value=d.song}});f.elements.slug.readOnly=true;document.getElementById('go').textContent='Save changes'});
f.onsubmit=async e=>{e.preventDefault();const d={...P,token},err=document.getElementById('err');err.textContent='';
 new FormData(f).forEach((v,k)=>{if(typeof v=='string')d[k]=v});d.song=sp.value=='upload'?(P.song||''):sp.value;delete d.songpick;
 const r=await fetch('/api/save',{method:'POST',body:JSON.stringify(d)}),j=await r.json();
 if(!r.ok){err.textContent=j.error||'Could not save. Try again.';return}
 const o=document.getElementById('out');o.hidden=false;
 o.innerHTML=`<b>Your invitation is ready.</b><p>Share this link with guests:<br><a href="/i/${j.slug}">${location.origin}/i/${j.slug}</a></p>
 <p>Keep this private link to edit it later:<br><a href="/?edit=${j.slug}&token=${j.token}">${location.origin}/?edit=${j.slug}&amp;token=${j.token}</a></p>`;o.scrollIntoView()};
</script></body></html>
